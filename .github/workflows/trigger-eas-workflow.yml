name: Trigger EAS Workflow

on:
    workflow_dispatch:
        inputs:
            build_target:
                description: Which build to trigger
                type: choice
                required: true
                options:
                    - development
                    - preview
                    - production
                default: development
            need_android_build:
                description: Build Android app
                type: boolean
                default: false
jobs:
    trigger:
        name: EAS — trigger build
        runs-on: ubuntu-latest
        env:
            EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
            BUILD_TARGET: ${{ inputs.build_target }}
            NEED_ANDROID_BUILD: ${{ inputs.need_android_build }}
        steps:
            - name: Checkout
              uses: actions/checkout@v5
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.11

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Trigger EAS workflow
              run: |
                 bunx eas-cli@latest workflow:run .eas/workflows/create-${BUILD_TARGET}-build.yml -F need_android_build=$NEED_ANDROID_BUILD